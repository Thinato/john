# Builds the desktop apps and attaches them to a GitHub Release when a v* tag is pushed (git tag v1.0 && git push
# origin v1.0). A manual run builds and uploads the packages as workflow artifacts only, without a release.
# Each package holds john, john-mcp, lessons/, i18n/ and fonts/; the apps look for them next to themselves
# first (bundled() in src/song.cpp), so the folder works from anywhere.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos  # universal binary (Apple silicon + Intel), macOS 11 or later
            cmake: -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - os: ubuntu-latest
            platform: linux
            cmake: -DGLFW_BUILD_WAYLAND=OFF
          - os: windows-latest
            platform: windows  # MSVC, x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash  # Git Bash on Windows
    steps:
      - uses: actions/checkout@v7

      - name: Install GLFW build dependencies (X11, OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: |
          d=john-${{ matrix.platform }}
          mkdir -p $d/fonts
          if [ "$RUNNER_OS" = Windows ]; then cp build/Release/john.exe build/Release/john-mcp.exe $d/  # Visual Studio: one folder per config
          else cp build/john build/john-mcp $d/; fi
          cp -R lessons i18n $d/
          cp build/Bravura.otf build/NotoSans-Regular.ttf $d/fonts/
          curl -fsSL -o $d/fonts/Bravura-LICENSE.txt https://raw.githubusercontent.com/steinbergmedia/bravura/master/LICENSE.txt
          curl -fsSL -o $d/fonts/NotoSans-LICENSE.txt https://raw.githubusercontent.com/notofonts/latin-greek-cyrillic/main/OFL.txt
          case $RUNNER_OS in
            macOS) zip -qry $d.zip $d ;;
            Windows) 7z a -bso0 $d.zip $d ;;
            *) tar czf $d.tar.gz $d ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: john-${{ matrix.platform }}
          path: john-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" john-macos.zip john-linux.tar.gz john-windows.zip --repo "$GITHUB_REPOSITORY" --title "John $GITHUB_REF_NAME" --generate-notes
