# Builds the web version (emscripten, same setup as the `web` job in ci.yml) and publishes it to GitHub Pages:
# https://lisecki.dev/john/ . Pages source: GitHub Actions; the domain comes from the user site (Thinato/thinato.github.io, CNAME lisecki.dev).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:  # one deploy at a time; let a running one finish
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.13

      - name: Configure
        run: emcmake cmake -S . -B build-web

      - name: Build
        run: cmake --build build-web --parallel

      # omr/: the image reader (#75), with its model, runtimes and licences (downloaded and checked by CMake)
      - name: Collect the site (john.html served as index.html)
        run: |
          mkdir site
          cp build-web/john.js build-web/john.wasm build-web/john.data site/
          cp -R build-web/omr site/
          cp build-web/john.html site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # A separate job, as in GitHub's Pages starter workflow: deploy-pages in the same job as the upload sometimes found
  # no artifact yet (2026-11-24, twice: "No artifacts named github-pages"). A finished job's artifact is listed.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
