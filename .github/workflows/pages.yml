# Builds the web version (emscripten, same setup as the `web` job in ci.yml) and publishes it to GitHub Pages:
# https://thinato.github.io/john/ . One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:  # one deploy at a time; let a running one finish
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.13

      - name: Configure
        run: emcmake cmake -S . -B build-web

      - name: Build
        run: cmake --build build-web --parallel

      - name: Collect the site (john.html served as index.html)
        run: |
          mkdir site
          cp build-web/john.js build-web/john.wasm build-web/john.data site/
          cp build-web/john.html site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
