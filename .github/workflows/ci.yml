# Builds everything (core, MCP server, GUI) and runs ctest: core self-checks + MCP smoke test.
# Require the "test (ubuntu-latest)" and "test (macos-latest)" checks in the branch rules.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:  # a new push to a PR cancels its older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install GLFW build dependencies (X11, OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGLFW_BUILD_WAYLAND=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Windows (MSVC, Visual Studio generator: multi-config, so --config/-C). Not a required check.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package check (temporary, removed before merge)
        shell: bash
        run: |
          d=john-windows
          mkdir -p $d/fonts
          cp build/Release/john.exe build/Release/john-mcp.exe $d/
          cp -R lessons i18n $d/
          cp build/Bravura.otf build/NotoSans-Regular.ttf $d/fonts/
          7z a -bso0 $d.zip $d
          mkdir unz && cd unz && 7z x -bso0 ../$d.zip
          mv ../lessons ../lessons-hidden  # the build-time path must not be the one found
          export JOHN_HOME="$(mktemp -d)/Déjà"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"t","version":"1"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_songs","arguments":{}}}' | ./$d/john-mcp.exe | tee out.txt
          grep -q 'lesson-1-breath' out.txt
          grep -q 'Déjà' out.txt || true
          ls "$JOHN_HOME/songs" | head -3

  # Web build of the viewer (emscripten, see README). Not a required check.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.13

      - name: Configure
        run: emcmake cmake -S . -B build-web

      - name: Build
        run: cmake --build build-web --parallel
