# Builds everything (core, MCP server, GUI) and runs ctest: core self-checks + MCP smoke test.
# Require the "test (ubuntu-latest)" and "test (macos-latest)" checks in the branch rules.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:  # a new push to a PR cancels its older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install GLFW build dependencies (X11, OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGLFW_BUILD_WAYLAND=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Windows (MSVC, Visual Studio generator: multi-config, so --config/-C). Not a required check.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # Web build of the viewer (emscripten, see README). Not a required check.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.13

      - name: Configure
        run: emcmake cmake -S . -B build-web

      - name: Build
        run: cmake --build build-web --parallel

      # the image reader (#75) the Pages deploy copies: CMake downloaded and checked its model and runtimes
      - name: Check the image reader files
        run: |
          for f in coi-serviceworker.js omr/manifest.json omr/worker.js omr/omr.js omr/NOTICE.txt omr/copisteria/write.js \
                   omr/models/copista-2m-trunk.onnx omr/ort/ort.min.mjs omr/ort/ort-wasm-simd-threaded.jsep.wasm omr/pdfjs/pdf.min.mjs; do
            test -s build-web/$f || { echo "missing build-web/$f"; exit 1; }
          done
          node --input-type=module --check < build-web/omr/worker.js
          node --input-type=module --check < build-web/omr/omr.js
